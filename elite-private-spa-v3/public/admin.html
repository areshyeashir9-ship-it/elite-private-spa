<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Elite Private Spa</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Elite Private Spa</h1><p>Admin Dashboard</p></header><main>
<section class="panel" id="loginBox"><h2>Admin Login</h2><form id="login"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button>Login</button></form><p id="loginMsg"></p></section>
<section id="dashboard" hidden><div class="row"><h2>Bookings</h2><button class="secondary" id="logout">Log out</button></div><div id="bookings"></div></section></main>
<script>
const $=s=>document.querySelector(s);
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function refresh(){const list=await api('/api/admin/bookings');$('#bookings').innerHTML=list.map(b=>`<article class="booking"><h3>#${b.id} — ${esc(b.customer_name)}</h3><p>${esc(b.package_name)} · ${esc(b.service_date)} · ${esc(b.phone)}</p><p>${esc(b.email)} · ${esc(b.location)}</p><label>Booking status<select id="s${b.id}"><option ${b.status==='Pending'?'selected':''}>Pending</option><option ${b.status==='Confirmed'?'selected':''}>Confirmed</option><option ${b.status==='Rejected'?'selected':''}>Rejected</option></select></label><label>Payment number<input id="n${b.id}" value="${esc(b.payment_number||'')}" placeholder="Enter this customer's payment number"></label><label>Account name<input id="a${b.id}" value="${esc(b.account_name||'')}"></label><label>Payment instructions<textarea id="i${b.id}" rows="2">${esc(b.payment_instructions||'')}</textarea></label><label>Payment status<select id="p${b.id}"><option ${b.payment_status==='Unpaid'?'selected':''}>Unpaid</option><option ${b.payment_status==='Paid'?'selected':''}>Paid</option></select></label><button onclick="save(${b.id})">Save & Generate Private Link</button><p id="l${b.id}">${b.private_token?`Private link already generated.`:'No private link yet.'}</p></article>`).join('')||'<p>No bookings yet.</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.save=async id=>{try{const j=await api('/api/admin/bookings/'+id,{method:'PATCH',body:JSON.stringify({status:$('#s'+id).value,payment_number:$('#n'+id).value,account_name:$('#a'+id).value,payment_instructions:$('#i'+id).value,payment_status:$('#p'+id).value,generate_link:true})});$('#l'+id).innerHTML=`<a href="${j.privateLink}" target="_blank">${j.privateLink}</a> <button class="secondary" onclick="navigator.clipboard.writeText('${j.privateLink}')">Copy link</button>`;}catch(e){alert(e.message)}};
$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#loginBox').hidden=true;$('#dashboard').hidden=false;refresh()}catch(e){$('#loginMsg').textContent=e.message}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
</script></body></html>
