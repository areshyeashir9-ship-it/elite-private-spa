<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Payment Details | Elite Private Spa</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Elite Private Spa</h1><p>Your private payment details</p></header><main><section class="panel"><div id="details">Loading your payment details…</div></section></main><script>
const token=new URLSearchParams(location.search).get('token');const box=document.getElementById('details');
fetch('/api/payment/'+encodeURIComponent(token||'')).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error);return j}).then(b=>{box.innerHTML=`<h2>Hello, ${safe(b.customer_name)}</h2><p>Package: ${safe(b.package_name)}</p><p>Date: ${safe(b.service_date)}</p><h3>Payment number</h3><p class="pay">${safe(b.payment_number)}</p><p><b>Account name:</b> ${safe(b.account_name||'Not provided')}</p><h3>Instructions</h3><p>${safe(b.payment_instructions||'Please contact the spa for payment instructions.')}</p><p><b>Payment status:</b> ${safe(b.payment_status)}</p>`}).catch(e=>box.textContent=e.message);
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
